<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="mb-4">
        <h1 class="fw-bold">Gestión de clientes</h1>
        <p class="text-secondary">Registra, encuentra y mantén actualizados los datos de tus clientes.</p>
    </div>

    <div id="alerta"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="mb-3" id="tituloFormulario">Registrar cliente</h4>

            <form id="formCliente">
                <input type="hidden" id="clienteId">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">DNI</label>
                        <input type="text" id="dni" class="form-control" maxlength="8" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Apellido</label>
                        <input type="text" id="apellido" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="telefono" class="form-control" maxlength="15">
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary" id="btnGuardar">Registrar</button>
                    <button type="button" class="btn btn-outline-secondary d-none" id="btnCancelar">Cancelar edición</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="mb-3">Buscar clientes</h4>

            <div class="row g-2">
                <div class="col-md-4">
                    <input type="text" id="buscarDni" class="form-control" placeholder="Buscar por DNI">
                </div>

                <div class="col-md-4">
                    <input type="text" id="buscarNombre" class="form-control" placeholder="Buscar por nombre">
                </div>

                <div class="col-md-4 d-flex gap-2">
                    <button class="btn btn-dark flex-fill" id="btnBuscar">Buscar</button>
                    <button class="btn btn-outline-secondary flex-fill" id="btnLimpiar">Limpiar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Clientes registrados</h4>
                <button class="btn btn-outline-primary btn-sm" id="btnActualizar">Actualizar lista</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>DNI</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="tablaClientes"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
